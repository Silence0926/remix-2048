name: Leaderboard API Tests

on:
  push:
    branches:
      - main
    paths:
      - "web/leaderboard_server.py"
      - "web/test_leaderboard_api.py"
      - "requirements.txt"
      - ".github/workflows/test-leaderboard.yml"
  pull_request:
    paths:
      - "web/leaderboard_server.py"
      - "web/test_leaderboard_api.py"
      - "requirements.txt"
      - ".github/workflows/test-leaderboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leaderboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leaderboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PostgreSQL driver
        run: python -m pip install -r requirements.txt
      - name: Compile API
        run: python -m compileall -q web
      - name: Run SQLite integration tests
        run: python -m unittest discover -s web -p "test_*.py" -v
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leaderboard_test
        run: python -m unittest discover -s web -p "test_*.py" -v
